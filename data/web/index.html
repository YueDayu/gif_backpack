<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GIF 歌词背包</title>
  <style>
    :root {
      --bg: #101511;
      --panel: #182019;
      --panel-2: #202a22;
      --text: #eff7ec;
      --muted: #9eac9d;
      --line: #334033;
      --accent: #d4ff70;
      --accent-2: #ffcc33;
      --danger: #ff6b4a;
      --shadow: 0 16px 48px rgba(0, 0, 0, 0.28);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 12% 0%, rgba(212, 255, 112, 0.18), transparent 34%),
        radial-gradient(circle at 95% 10%, rgba(255, 204, 51, 0.12), transparent 30%),
        var(--bg);
      color: var(--text);
      font-family: "Hiragino Sans GB", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      border: 0;
      border-radius: 12px;
      cursor: pointer;
      color: #111611;
      background: var(--accent);
      min-height: 40px;
      padding: 9px 13px;
      font-weight: 700;
    }

    button.secondary {
      background: #2a352b;
      color: var(--text);
      border: 1px solid var(--line);
    }

    button.danger {
      background: var(--danger);
      color: #1b0d08;
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    input,
    select {
      width: 100%;
      color: var(--text);
      background: #111711;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 12px;
      outline: none;
    }

    input[type="color"] {
      height: 44px;
      padding: 5px;
    }

    input[type="range"] {
      padding: 0;
      accent-color: var(--accent);
    }

    .shell {
      width: min(980px, 100%);
      margin: 0 auto;
      padding: 18px 12px 40px;
    }

    .hero {
      display: grid;
      grid-template-columns: 128px 1fr;
      gap: 16px;
      align-items: center;
      padding: 18px;
      margin-bottom: 14px;
      background: linear-gradient(135deg, rgba(32, 42, 34, 0.96), rgba(18, 25, 19, 0.94));
      border: 1px solid var(--line);
      border-radius: 24px;
      box-shadow: var(--shadow);
    }

    .screen-wrap {
      width: 128px;
      height: 128px;
      padding: 8px;
      border-radius: 20px;
      background: #050705;
      border: 1px solid #354132;
    }

    #preview {
      width: 112px;
      height: 112px;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      background: #000;
      border-radius: 8px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(26px, 8vw, 46px);
      line-height: 0.95;
      letter-spacing: -0.06em;
    }

    .summary {
      margin: 0;
      color: var(--muted);
      line-height: 1.5;
      font-size: 14px;
    }

    .status {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 14px;
    }

    .stat {
      padding: 9px;
      border-radius: 14px;
      background: rgba(16, 21, 17, 0.8);
      border: 1px solid var(--line);
    }

    .stat b {
      display: block;
      color: var(--accent);
      font-size: 13px;
    }

    .stat span {
      display: block;
      margin-top: 4px;
      color: var(--text);
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .card {
      min-width: 0;
      background: rgba(24, 32, 25, 0.96);
      border: 1px solid var(--line);
      border-radius: 22px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .card header {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
      padding: 14px 15px 0;
    }

    .card h2 {
      margin: 0;
      font-size: 18px;
      letter-spacing: -0.02em;
    }

    .card-body {
      padding: 14px 15px 16px;
    }

    .control-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 10px;
    }

    .field {
      display: grid;
      gap: 6px;
      margin-bottom: 12px;
    }

    .field label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .gif-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(116px, 1fr));
      gap: 10px;
      max-height: 280px;
      overflow: auto;
      padding-right: 3px;
    }

    .gif-item,
    .song-item,
    .lyric-item {
      width: 100%;
      text-align: left;
      background: #111711;
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 10px;
    }

    .gif-item.active,
    .song-item.active,
    .lyric-item.active {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px rgba(212, 255, 112, 0.35) inset;
    }

    .gif-item img {
      display: block;
      width: 64px;
      height: 64px;
      margin-bottom: 8px;
      object-fit: contain;
      background: #000;
      border-radius: 8px;
    }

    .gif-item small,
    .song-item small,
    .lyric-item time {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 500;
    }

    .song-list {
      display: grid;
      gap: 8px;
      max-height: 360px;
      overflow: auto;
      padding-right: 3px;
    }

    .timeline {
      display: grid;
      gap: 7px;
      max-height: 430px;
      overflow: auto;
      padding-right: 3px;
    }

    .seek-row {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 10px;
    }

    #time-label {
      min-width: 86px;
      color: var(--accent);
      font-variant-numeric: tabular-nums;
      text-align: right;
      font-weight: 700;
    }

    .current-line {
      min-height: 44px;
      padding: 11px 12px;
      border-radius: 14px;
      background: #111711;
      border: 1px solid var(--line);
      color: var(--accent-2);
      line-height: 1.45;
    }

    .empty {
      color: var(--muted);
      padding: 16px;
      border: 1px dashed var(--line);
      border-radius: 14px;
    }

    @media (max-width: 720px) {
      .hero {
        grid-template-columns: 1fr;
      }

      .grid {
        grid-template-columns: 1fr;
      }

      .status,
      .control-row {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <main class="shell">
    <section class="hero">
      <div class="screen-wrap">
        <canvas id="preview" width="64" height="64"></canvas>
      </div>
      <div>
        <h1>GIF 歌词背包</h1>
        <p class="summary">GIF 和歌词是两条独立轨道。这里选择动画、选择歌曲、点歌词校准进度，并把颜色和两行位置同步到 ESP32。</p>
        <div class="status">
          <div class="stat"><b>存储</b><span id="storage-label">读取中</span></div>
          <div class="stat"><b>GIF</b><span id="gif-label">读取中</span></div>
          <div class="stat"><b>歌曲</b><span id="song-label">读取中</span></div>
        </div>
      </div>
    </section>

    <section class="grid">
      <article class="card">
        <header>
          <h2>显示控制</h2>
          <button id="display-toggle" class="secondary">读取中</button>
        </header>
        <div class="card-body">
          <div class="field">
            <label for="brightness">亮度 <span id="brightness-label">0</span>%</label>
            <input id="brightness" type="range" min="0" max="100" value="32">
          </div>
          <div class="field">
            <label for="lyric-color">歌词颜色</label>
            <input id="lyric-color" type="color" value="#ffcc33">
          </div>
          <div class="control-row">
            <div class="field">
              <label for="line1-y">第一行 Y <span id="line1-y-label">12</span></label>
              <input id="line1-y" type="range" min="0" max="48" value="12">
            </div>
            <div class="field">
              <label for="line2-y">第二行 Y <span id="line2-y-label">36</span></label>
              <input id="line2-y" type="range" min="0" max="48" value="36">
            </div>
          </div>
          <div class="field">
            <label>当前歌词</label>
            <div id="current-line" class="current-line">未选择歌曲</div>
          </div>
          <div class="seek-row">
            <input id="seek" type="range" min="0" max="0" value="0">
            <span id="time-label">00:00.000</span>
          </div>
          <div class="control-row">
            <button id="play-toggle">预览播放</button>
            <button id="sync-progress" class="secondary">同步当前进度</button>
          </div>
        </div>
      </article>

      <article class="card">
        <header>
          <h2>GIF 轨道</h2>
        </header>
        <div class="card-body">
          <div id="gif-list" class="gif-list"></div>
        </div>
      </article>

      <article class="card">
        <header>
          <h2>歌曲</h2>
        </header>
        <div class="card-body">
          <div class="field">
            <label for="song-search">搜索</label>
            <input id="song-search" type="search" placeholder="输入歌名 / 文件名">
          </div>
          <div id="song-list" class="song-list"></div>
        </div>
      </article>

      <article class="card">
        <header>
          <h2>歌词进度</h2>
        </header>
        <div class="card-body">
          <div id="timeline" class="timeline"></div>
        </div>
      </article>
    </section>
  </main>

  <script>
    const state = {
      device: {
        bright: 32,
        enable: true,
        gif: '',
        song: '',
        progressMs: 0,
        color: '#ffcc33',
        y1: 12,
        y2: 36,
      },
      gifs: [],
      songs: [],
      lyrics: [],
      glyphs: [],
      glyphMap: new Map(),
      fontBytes: new Uint8Array(),
      fontLoaded: false,
      durationMs: 0,
      currentMs: 0,
      playing: false,
      playStartedAt: 0,
      playBaseMs: 0,
      raf: 0,
      saveTimer: 0,
      activeLine: -1,
    };

    const els = {
      preview: document.getElementById('preview'),
      storageLabel: document.getElementById('storage-label'),
      gifLabel: document.getElementById('gif-label'),
      songLabel: document.getElementById('song-label'),
      displayToggle: document.getElementById('display-toggle'),
      brightness: document.getElementById('brightness'),
      brightnessLabel: document.getElementById('brightness-label'),
      lyricColor: document.getElementById('lyric-color'),
      line1Y: document.getElementById('line1-y'),
      line1YLabel: document.getElementById('line1-y-label'),
      line2Y: document.getElementById('line2-y'),
      line2YLabel: document.getElementById('line2-y-label'),
      currentLine: document.getElementById('current-line'),
      seek: document.getElementById('seek'),
      timeLabel: document.getElementById('time-label'),
      playToggle: document.getElementById('play-toggle'),
      syncProgress: document.getElementById('sync-progress'),
      gifList: document.getElementById('gif-list'),
      songSearch: document.getElementById('song-search'),
      songList: document.getElementById('song-list'),
      timeline: document.getElementById('timeline'),
    };

    const ctx = els.preview.getContext('2d');

    els.displayToggle.addEventListener('click', async () => {
      await saveState({ enable: state.device.enable ? '0' : '1' });
    });
    els.brightness.addEventListener('input', () => {
      state.device.bright = Number(els.brightness.value);
      renderControls();
      debouncedSave({ bright: String(state.device.bright) });
    });
    els.lyricColor.addEventListener('input', () => {
      state.device.color = els.lyricColor.value;
      drawFrame();
      debouncedSave({ color: state.device.color });
    });
    els.line1Y.addEventListener('input', () => {
      state.device.y1 = Number(els.line1Y.value);
      renderControls();
      drawFrame();
      debouncedSave({ y1: String(state.device.y1) });
    });
    els.line2Y.addEventListener('input', () => {
      state.device.y2 = Number(els.line2Y.value);
      renderControls();
      drawFrame();
      debouncedSave({ y2: String(state.device.y2) });
    });
    els.seek.addEventListener('input', () => {
      setLocalTime(Number(els.seek.value));
    });
    els.seek.addEventListener('change', () => {
      syncProgress(Number(els.seek.value));
    });
    els.playToggle.addEventListener('click', togglePreview);
    els.syncProgress.addEventListener('click', () => syncProgress(state.currentMs));
    els.songSearch.addEventListener('input', renderSongs);

    window.addEventListener('load', init);

    async function init() {
      try {
        await refreshState();
        renderAll();
        await refreshGifs();
        renderGifs();
        await refreshSongs();
        renderSongs();
        setLocalTime(state.device.progressMs || 0);
      } catch (err) {
        alert(String(err));
      }
    }

    async function refreshState() {
      state.device = await fetchJson('/api/state');
      state.currentMs = state.device.progressMs || 0;
    }

    async function refreshGifs() {
      const data = await fetchJson('/api/gifs');
      state.gifs = data.files || [];
      els.storageLabel.textContent = `${readableSize(data.used || 0)} / ${readableSize(data.total || 0)}`;
    }

    async function refreshSongs() {
      state.songs = await fetchJson('/api/songs');
    }

    async function loadFont() {
      if (state.fontLoaded) return;
      const [charsetText, fontBuffer] = await Promise.all([
        fetchText('/lyrics/charset.txt'),
        fetchArrayBuffer('/lyrics/font.bin'),
      ]);
      state.fontBytes = new Uint8Array(fontBuffer);
      state.glyphs = [];
      state.glyphMap = new Map();

      let offset = 0;
      for (const ch of Array.from(charsetText)) {
        const width = isHan(ch) ? 16 : 8;
        const byteLength = width * 16 / 8;
        const glyph = { ch, width, height: 16, offset, byteLength };
        state.glyphMap.set(ch, glyph);
        state.glyphs.push(glyph);
        offset += byteLength;
      }
      state.fontLoaded = true;
    }

    async function loadSong(filename) {
      if (!filename) {
        state.lyrics = [];
        state.durationMs = 0;
        setLocalTime(0);
        return;
      }
      const text = await fetchText(`/api/lyric?file=${encodeURIComponent(filename)}`);
      state.lyrics = parseLrc(text);
      state.durationMs = state.lyrics.length ? state.lyrics[state.lyrics.length - 1].timeMs + 5000 : 0;
      state.activeLine = -1;
      els.seek.max = String(state.durationMs);
      renderTimeline(true);
    }

    async function ensurePreviewAssets(filename = state.device.song) {
      if (!filename) return false;
      await loadFont();
      if (!state.lyrics.length || state.device.song !== filename) {
        await loadSong(filename);
      }
      return state.lyrics.length > 0;
    }

    async function saveState(patch) {
      const body = new URLSearchParams(patch);
      state.device = await fetchJson('/api/state', { method: 'POST', body });
      state.currentMs = state.device.progressMs || state.currentMs;
      renderAll();
    }

    function debouncedSave(patch) {
      clearTimeout(state.saveTimer);
      state.saveTimer = setTimeout(() => saveState(patch).catch((err) => alert(String(err))), 180);
    }

    async function selectGif(filename) {
      await saveState({ gif: filename });
      renderGifs();
    }

    async function selectSong(filename) {
      stopPreview();
      await saveState({ song: filename, progress: '0' });
      await loadFont();
      await loadSong(filename);
      setLocalTime(0);
      startPreview();
      renderAll();
    }

    async function syncProgress(ms) {
      if (!state.lyrics.length) {
        const ready = await ensurePreviewAssets();
        if (!ready) return;
      }
      const clamped = clamp(Math.round(ms), 0, state.durationMs);
      setLocalTime(clamped);
      await saveState({ progress: String(clamped) });
    }

    function togglePreview() {
      if (state.playing) {
        stopPreview();
      } else {
        startPreview();
      }
    }

    function startPreview() {
      if (!state.lyrics.length) {
        ensurePreviewAssets().then((ready) => {
          if (ready) startPreview();
        }).catch((err) => alert(String(err)));
        return;
      }
      state.playing = true;
      state.playStartedAt = performance.now();
      state.playBaseMs = state.currentMs;
      els.playToggle.textContent = '暂停预览';
      tick();
    }

    function stopPreview() {
      state.playing = false;
      cancelAnimationFrame(state.raf);
      els.playToggle.textContent = '预览播放';
    }

    function tick() {
      if (!state.playing) return;
      const ms = Math.min(state.durationMs, state.playBaseMs + performance.now() - state.playStartedAt);
      setLocalTime(ms);
      if (ms >= state.durationMs) {
        stopPreview();
        return;
      }
      state.raf = requestAnimationFrame(tick);
    }

    function setLocalTime(ms) {
      state.currentMs = clamp(Math.round(ms), 0, state.durationMs);
      els.seek.value = String(state.currentMs);
      els.timeLabel.textContent = formatTime(state.currentMs);
      drawFrame();
      const active = state.lyrics.length ? findCurrentLineIndex(state.currentMs) : -1;
      if (active !== state.activeLine) {
        renderTimeline();
      } else if (active >= 0) {
        els.currentLine.textContent = state.lyrics[active]?.text || '';
      }
    }

    function renderAll() {
      renderControls();
      renderGifs();
      renderSongs();
      renderTimeline(true);
      drawFrame();
    }

    function renderControls() {
      els.displayToggle.textContent = state.device.enable ? '关闭显示' : '开启显示';
      els.displayToggle.className = state.device.enable ? 'danger' : '';
      els.brightness.value = state.device.bright;
      els.brightnessLabel.textContent = state.device.bright;
      els.lyricColor.value = normalizeColor(state.device.color);
      els.line1Y.value = state.device.y1;
      els.line1YLabel.textContent = state.device.y1;
      els.line2Y.value = state.device.y2;
      els.line2YLabel.textContent = state.device.y2;
      els.gifLabel.textContent = state.device.gif || '无动画';
      const song = findSong(state.device.song);
      els.songLabel.textContent = song ? song.title : (state.device.song || '未选择');
      els.seek.max = String(state.durationMs);
      els.playToggle.disabled = !state.device.song;
      els.syncProgress.disabled = !state.device.song;
    }

    function renderGifs() {
      els.gifList.innerHTML = '';
      const none = document.createElement('button');
      none.className = `gif-item${!state.device.gif ? ' active' : ''}`;
      none.innerHTML = '<strong>无动画</strong><small>只显示歌词</small>';
      none.onclick = () => selectGif('');
      els.gifList.append(none);

      for (const gif of state.gifs) {
        const item = document.createElement('button');
        item.className = `gif-item${gif.name === state.device.gif ? ' active' : ''}`;
        const img = document.createElement('img');
        img.src = `/gif?img=${encodeURIComponent(gif.name)}`;
        img.alt = gif.name;
        const name = document.createElement('strong');
        name.textContent = gif.name;
        const size = document.createElement('small');
        size.textContent = readableSize(gif.size || 0);
        item.append(img, name, size);
        item.onclick = () => selectGif(gif.name);
        els.gifList.append(item);
      }
    }

    function renderSongs() {
      const keyword = els.songSearch.value.trim().toLowerCase();
      const filtered = state.songs.filter((song) => {
        if (!keyword) return true;
        return `${song.title || ''} ${song.artist || ''} ${song.file || ''}`.toLowerCase().includes(keyword);
      });

      els.songList.innerHTML = '';
      if (!filtered.length) {
        els.songList.innerHTML = '<div class="empty">没有匹配歌曲</div>';
        return;
      }
      for (const song of filtered) {
        const item = document.createElement('button');
        item.className = `song-item${song.file === state.device.song ? ' active' : ''}`;
        const title = document.createElement('strong');
        title.textContent = song.title || song.file;
        const meta = document.createElement('small');
        meta.textContent = `${song.artist || '五月天'} · ${song.file}`;
        item.append(title, meta);
        item.onclick = () => selectSong(song.file);
        els.songList.append(item);
      }
    }

    function renderTimeline(force = false) {
      if (!state.lyrics.length) {
        els.timeline.innerHTML = '<div class="empty">选择歌曲后，点击任意歌词行即可校准设备进度。</div>';
        els.currentLine.textContent = '未选择歌曲';
        state.activeLine = -1;
        return;
      }

      const active = findCurrentLineIndex(state.currentMs);
      els.currentLine.textContent = state.lyrics[active]?.text || '';
      if (!force && active === state.activeLine && els.timeline.children.length) {
        return;
      }
      state.activeLine = active;
      els.timeline.innerHTML = '';
      for (let i = 0; i < state.lyrics.length; i++) {
        const line = state.lyrics[i];
        const row = document.createElement('button');
        row.className = `lyric-item${i === active ? ' active' : ''}`;
        const text = document.createElement('span');
        text.textContent = line.text;
        const time = document.createElement('time');
        time.textContent = formatTime(line.timeMs);
        row.append(text, time);
        row.onclick = () => syncProgress(line.timeMs);
        els.timeline.append(row);
      }
    }

    function drawFrame() {
      ctx.fillStyle = '#000000';
      ctx.fillRect(0, 0, 64, 64);
      if (!state.lyrics.length) return;

      const index = findCurrentLineIndex(state.currentMs);
      if (index < 0) return;

      const line = state.lyrics[index];
      const firstX = getScrollX(index, state.currentMs);
      const color = normalizeColor(state.device.color);
      drawGlyphLine(line.text, firstX, state.device.y1, color);
      drawFutureLine(index, firstX, state.device.y2, color);
    }

    function drawFutureLine(index, firstX, y, color) {
      const line = state.lyrics[index];
      const secondX = firstX - 64;
      drawGlyphLine(line.text, secondX, y, color);

      const next = state.lyrics[index + 1];
      if (!next) return;
      const currentTailRight = secondX + getLineWidth(line.text);
      const nextX = Math.max(0, currentTailRight + 4);
      if (nextX < 64) drawGlyphLine(next.text, nextX, y, color);
    }

    function drawGlyphLine(text, startX, startY, color) {
      ctx.fillStyle = color;
      let cursorX = startX;
      for (const ch of Array.from(text)) {
        const glyph = state.glyphMap.get(ch);
        const width = glyph?.width || 8;
        if (glyph && cursorX < 64 && cursorX + width > 0) {
          for (let y = 0; y < glyph.height; y++) {
            const py = startY + y;
            if (py < 0 || py >= 64) continue;
            for (let x = 0; x < glyph.width; x++) {
              const px = cursorX + x;
              if (px < 0 || px >= 64) continue;
              if (glyphBit(glyph, x, y)) ctx.fillRect(px, py, 1, 1);
            }
          }
        }
        cursorX += width;
      }
    }

    function glyphBit(glyph, x, y) {
      const bitIndex = y * glyph.width + x;
      const byteOffset = glyph.offset + (bitIndex >> 3);
      return (state.fontBytes[byteOffset] & (0x80 >> (bitIndex & 7))) !== 0;
    }

    function getScrollX(index, ms) {
      const line = state.lyrics[index];
      const width = getLineWidth(line.text);
      if (width <= 64) return Math.floor((64 - width) / 2);

      const nextStart = state.lyrics[index + 1]?.timeMs ?? state.durationMs;
      const duration = Math.max(1500, nextStart - line.timeMs);
      const progress = clamp((ms - line.timeMs) / duration, 0, 1);
      return -Math.round((width - 64) * progress);
    }

    function getLineWidth(text) {
      let width = 0;
      for (const ch of Array.from(text)) {
        width += state.glyphMap.get(ch)?.width || 8;
      }
      return width;
    }

    function parseLrc(text) {
      const lines = [];
      for (const rawLine of text.split(/\r?\n/)) {
        const matches = [...rawLine.matchAll(/\[(\d{1,3}):(\d{2})(?:[.:](\d{1,3}))?\]/g)];
        if (!matches.length) continue;
        const content = rawLine.replace(/\[[^\]]+\]/g, '').trim();
        if (!content) continue;
        for (const match of matches) {
          const minutes = Number(match[1]);
          const seconds = Number(match[2]);
          const fraction = match[3] || '0';
          const ms = Number(fraction.padEnd(3, '0').slice(0, 3));
          lines.push({ timeMs: minutes * 60000 + seconds * 1000 + ms, text: content });
        }
      }
      return lines.sort((a, b) => a.timeMs - b.timeMs);
    }

    function findCurrentLineIndex(ms) {
      let index = 0;
      for (let i = 0; i < state.lyrics.length; i++) {
        if (state.lyrics[i].timeMs <= ms) index = i;
        else break;
      }
      return index;
    }

    function findSong(filename) {
      return state.songs.find((song) => song.file === filename);
    }

    function isHan(ch) {
      return /\p{Script=Han}/u.test(ch);
    }

    function normalizeColor(value) {
      return /^#[0-9a-f]{6}$/i.test(value || '') ? value : '#ffcc33';
    }

    function readableSize(bytes) {
      if (bytes < 1024) return `${bytes}B`;
      if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)}KB`;
      return `${(bytes / 1024 / 1024).toFixed(2)}MB`;
    }

    function formatTime(ms) {
      const total = Math.max(0, Math.floor(ms));
      const minutes = Math.floor(total / 60000);
      const seconds = Math.floor((total % 60000) / 1000);
      const millis = total % 1000;
      return `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}.${String(millis).padStart(3, '0')}`;
    }

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    async function fetchJson(url, options) {
      const res = await fetch(url, options);
      if (!res.ok) throw new Error(`${url} ${res.status}`);
      return res.json();
    }

    async function fetchText(url) {
      const res = await fetch(url);
      if (!res.ok) throw new Error(`${url} ${res.status}`);
      return res.text();
    }

    async function fetchArrayBuffer(url) {
      const res = await fetch(url);
      if (!res.ok) throw new Error(`${url} ${res.status}`);
      return res.arrayBuffer();
    }
  </script>
